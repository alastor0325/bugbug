[project]
name = "hackbot-agent-review-load"
version = "0.1.0"
description = "Cloud Run Job image that posts a daily review-load recap for a Phabricator review group"
requires-python = ">=3.14"
dependencies = [
    "hackbot-runtime",
    "phabricator-client",
    "phabricator-proxy",
    "httpx>=0.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.1.0",
    "starlette",
    "tenacity",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.uv.sources]
hackbot-runtime = { workspace = true }
phabricator-client = { workspace = true }
phabricator-proxy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
